<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Transkrip Keaktifan Mahasiswa</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-6">

    <div class="text-center mb-10">
        <h1 class="text-2xl md:text-3xl font-extrabold text-slate-800 tracking-tight uppercase">
            Sistem Transkrip Keaktifan Mahasiswa
        </h1>
        <p class="text-lg text-slate-600 mt-2 font-medium">UNIVERSITAS SURYA CEMERLANG</p>
    </div>

    <div class="w-full max-w-md glass-effect shadow-2xl rounded-[2rem] p-10">
        <div class="flex justify-center mb-8">
            <div
                class="w-32 h-32 bg-slate-100 rounded-2xl flex items-center justify-center border-2 border-dashed border-slate-300">
                <i class="fa-solid fa-graduation-cap text-5xl text-blue-600"></i>
            </div>
        </div>

        <form id="loginForm" class="space-y-6">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <input type="email" id="email" placeholder="Email USC" required
                    class="w-full pl-11 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            </div>

            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <input type="password" id="password" placeholder="Password" required
                    class="w-full pl-11 pr-12 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">

                <button type="button" onclick="togglePassword()"
                    class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-blue-600">
                    <i class="fa-solid fa-eye-slash" id="toggleIcon"></i>
                </button>
            </div>

            <button type="submit" id="btnMasuk"
                class="w-full py-4 bg-slate-900 text-white font-bold rounded-2xl hover:bg-blue-600 transition-all transform active:scale-95 uppercase tracking-wider">
                Masuk
            </button>
        </form>
    </div>

    <p class="mt-12 text-slate-400 text-xs">
        &copy; 2026 Universitas Surya Cemerlang. All Rights Reserved.
    </p>

    <script>
        function togglePassword() {
            const passwordField = document.getElementById("password");
            const toggleIcon = document.getElementById("toggleIcon");
            if (passwordField.type === "password") {
                passwordField.type = "text";
                toggleIcon.className = "fa-solid fa-eye";
            } else {
                passwordField.type = "password";
                toggleIcon.className = "fa-solid fa-eye-slash";
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const btn = document.getElementById('btnMasuk');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Memproses...';
            btn.classList.add('opacity-70', 'cursor-not-allowed');

            setTimeout(() => {
                window.location.href = "index.html";
            }, 1200);
        });
    </script>
</body>

</html>
