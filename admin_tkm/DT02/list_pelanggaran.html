<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Pelanggaran - Admin TKM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .sidebar-active {
            background: rgba(255, 255, 255, 0.1);
            border-left: 4px solid #3b82f6;
            color: #3b82f6 !important;
            font-weight: 700;
        }

        .table-custom {
            border: 1px solid #000;
        }

        .table-custom th,
        .table-custom td {
            border: 1px solid #000;
            padding: 12px;
        }

        .btn-page-active {
            background-color: #3b82f6 !important;
            color: white !important;
            font-weight: bold;
            border: 1px solid #3b82f6;
        }
    </style>
</head>

<body class="bg-[#f9fafb] flex h-screen overflow-hidden text-gray-800">
    <aside class="w-72 bg-[#1e293b] text-gray-300 p-6 flex flex-col gap-8 shadow-xl z-20">
        <div class="px-2">
            <h1 class="font-bold text-white text-lg">Admin TKM</h1>
            <p class="text-[10px] text-gray-400 uppercase tracking-widest">Universitas Surya Cemerlang</p>
        </div>
        <nav class="flex flex-col gap-2 text-sm">
            <a href="../index.html"
                class="flex items-center p-3 rounded-lg hover:bg-gray-800 text-gray-400 transition">Dashboard</a>
            <a href="../dt01/index.html"
                class="flex items-center p-3 rounded-lg hover:bg-gray-800 text-gray-400 transition">Manajemen Kategori
                &<br>Kegiatan</a>
            <a href="index.html" class="flex items-center p-3 rounded-lg sidebar-active transition">Kelola
                Pelanggaran</a>
            <a href="../dt03/index.html"
                class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400">
                Validasi Laporan
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-end px-8 relative z-50">
            <div class="relative inline-block text-left">
                <button id="userMenuBtn"
                    class="flex items-center gap-3 hover:bg-gray-50 p-2 rounded-xl transition-all outline-none">
                    <div class="text-right">
                        <p class="text-sm font-bold text-gray-900 leading-none">Bahlil</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <div
                            class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center border border-gray-200">
                            <i class="fa-solid fa-user text-gray-400"></i>
                        </div>
                        <i class="fa-solid fa-chevron-down text-[10px] text-gray-400 transition-transform duration-300"
                            id="chevronIcon"></i>
                    </div>
                </button>
                <div id="dropdownMenu"
                    class="hidden absolute right-0 mt-2 w-48 bg-white border border-gray-100 rounded-2xl shadow-xl py-2 z-50">
                    <button onclick="handleLogout()"
                        class="w-full flex items-center gap-3 px-4 py-3 text-sm text-red-500 hover:bg-red-50 transition-all">
                        <i class="fa-solid fa-right-from-bracket w-5 text-center"></i> Logout
                    </button>
                </div>
            </div>
        </header>

        <div class="flex-1 p-10 overflow-y-auto">
            <div class="max-w-6xl mx-auto">
                <h2 class="text-3xl font-bold text-center text-gray-900 mb-2">Pelanggaran</h2>
                <p id="subTitleKategori" class="text-center text-gray-500 mb-8 font-medium"></p>

                <div class="flex justify-end gap-3 mb-4">
                    <select id="filterJenis"
                        class="bg-gray-200 px-4 py-2 rounded-full text-sm font-bold outline-none cursor-pointer">
                        <option value="Semua">Jenis Pelanggaran</option>
                        <option value="Ringan">Ringan</option>
                        <option value="Sedang">Sedang</option>
                        <option value="Berat">Berat</option>
                    </select>
                    <button
                        onclick="localStorage.removeItem('editPelanggaranIndex'); window.location.href='form_pelanggaran.html'"
                        class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2 shadow-sm">
                        <i class="fa-solid fa-plus text-[10px]"></i> Buat Pelanggaran
                    </button>
                </div>

                <div class="bg-white overflow-hidden shadow-sm">
                    <table class="w-full text-left border-collapse table-custom">
                        <thead>
                            <tr class="bg-white text-gray-900">
                                <th class="w-12 text-center">No</th>
                                <th>Nama Pelanggaran</th>
                                <th>Jenis Pelanggaran</th>
                                <th>Pengurangan Nilai TKM</th>
                                <th class="w-24 text-center">Bukti</th>
                                <th class="w-24 text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="listTableBody"></tbody>
                    </table>
                </div>

                <div class="mt-8 flex flex-col items-center relative">
                    <div class="absolute left-0">
                        <button onclick="window.location.href='index.html'"
                            class="flex items-center gap-2 font-bold italic text-sm"><i
                                class="fa-solid fa-circle-chevron-left"></i> Kembali</button>
                    </div>
                    <div class="flex items-center gap-4 text-sm font-medium">
                        <button id="prevBtn" class="disabled:opacity-30">Sebelumnya</button>
                        <div id="paginationNumbers" class="flex gap-1"></div>
                        <button id="nextBtn" class="disabled:opacity-30">Selanjutnya</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const activeKategori = localStorage.getItem('selectedKategori') || "Umum";
        document.getElementById('subTitleKategori').innerText = `Kategori: ${activeKategori}`;

        let masterDetail = JSON.parse(localStorage.getItem('masterDetailPelanggaran')) || {};

        if (!masterDetail[activeKategori]) {
            masterDetail[activeKategori] = [];
            localStorage.setItem('masterDetailPelanggaran', JSON.stringify(masterDetail));
        }

        let allData = masterDetail[activeKategori];
        let filteredData = [...allData];
        let currentPage = 1;
        const rowsPerPage = 10;

        function renderTable() {
            const tbody = document.getElementById('listTableBody');
            tbody.innerHTML = '';

            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-10 text-gray-400 italic">Belum ada data pelanggaran untuk kategori ini.</td></tr>`;
                updatePagination();
                return;
            }

            const start = (currentPage - 1) * rowsPerPage;
            const paginatedItems = filteredData.slice(start, start + rowsPerPage);

            paginatedItems.forEach((item, index) => {
                const realIndex = start + index;
                tbody.innerHTML += `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="text-center font-medium">${realIndex + 1}</td>
                    <td class="font-semibold text-sm text-gray-700">${item.nama}</td>
                    <td><span class="px-3 py-1 border rounded-full text-[10px] font-extrabold uppercase ${getBadgeStyle(item.jenis)}">${item.jenis}</span></td>
                    <td class="text-red-600 font-bold">-${item.poin}</td>
                    <td class="text-center text-[11px] font-bold ${item.bukti === 'Wajib' ? 'text-orange-600' : 'text-gray-400'}">${item.bukti}</td>
                    <td class="text-center">
                        <div class="flex justify-center gap-3 text-gray-400">
                            <button onclick="editData(${realIndex})" class="hover:text-blue-600 transition-colors">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button onclick="deleteData(${realIndex})" class="hover:text-red-600 transition-colors">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </td>
                </tr>`;
            });
            updatePagination();
        }

        // Fungsi Edit: Menyimpan index ke storage dan pindah halaman
        function editData(idx) {
            localStorage.setItem('editPelanggaranIndex', idx);
            window.location.href = 'form_pelanggaran.html';
        }

        function deleteData(idx) {
            if (confirm("Hapus data ini secara permanen?")) {
                allData.splice(idx, 1);
                masterDetail[activeKategori] = allData;
                localStorage.setItem('masterDetailPelanggaran', JSON.stringify(masterDetail));
                filteredData = [...allData];
                renderTable();
            }
        }

        function getBadgeStyle(j) {
            if (j === 'Berat') return 'bg-red-100 text-red-600 border-red-200';
            if (j === 'Sedang') return 'bg-yellow-100 text-yellow-700 border-yellow-200';
            return 'bg-green-100 text-green-600 border-green-200';
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredData.length / rowsPerPage) || 1;
            const container = document.getElementById('paginationNumbers');
            container.innerHTML = '';
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.innerText = i;
                btn.className = `w-8 h-8 rounded transition-all ${i === currentPage ? 'btn-page-active' : 'hover:bg-gray-200'}`;
                btn.onclick = () => { currentPage = i; renderTable(); };
                container.appendChild(btn);
            }
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages || filteredData.length === 0;
        }

        document.getElementById('filterJenis').onchange = (e) => {
            filteredData = e.target.value === 'Semua' ? [...allData] : allData.filter(d => d.jenis === e.target.value);
            currentPage = 1;
            renderTable();
        };

        renderTable();
        // --- Fungsi Logout & Menu User ---
        const menuBtn = document.getElementById('userMenuBtn');
        const dropdown = document.getElementById('dropdownMenu');
        const chevron = document.getElementById('chevronIcon');

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isHidden = dropdown.classList.toggle('hidden');
            if (chevron) {
                chevron.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(180deg)';
            }
        });

        // Tutup dropdown jika klik di luar
        window.addEventListener('click', () => {
            dropdown.classList.add('hidden');
            if (chevron) chevron.style.transform = 'rotate(0deg)';
        });

        function handleLogout() {
            if (confirm("Logout dari sistem?")) {
                window.location.href = "../login.html";
            }
        }
    </script>
</body>

</html>
