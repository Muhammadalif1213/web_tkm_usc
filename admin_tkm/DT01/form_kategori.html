<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Kategori - Admin TKM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        /* Styling untuk menu yang sedang aktif */
        .sidebar-active {
            background: rgba(255, 255, 255, 0.1);
            border-left: 4px solid #3b82f6;
            color: #3b82f6 !important;
            font-weight: 700;
        }

        .form-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }
    </style>
</head>

<body class="bg-[#f9fafb] flex h-screen overflow-hidden text-gray-800">

    <aside class="w-72 bg-[#1e293b] text-gray-300 p-6 flex flex-col gap-8 shadow-xl z-20">
        <div class="flex items-center gap-3 px-2">
            <div>
                <h1 class="font-bold text-white text-lg tracking-tight">Admin TKM</h1>
                <p class="text-[10px] text-gray-400 uppercase tracking-widest">Universitas Surya Cemerlang</p>
            </div>
        </div>

        <nav class="flex flex-col gap-2 text-sm">
            <a href="../index.html"
                class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400 hover:text-white">
                Dashboard
            </a>
            <a href="index.html" class="flex items-center p-3 rounded-lg sidebar-active transition hover:text-white">
                Manajemen Kategori & Kegiatan
            </a>
            <a href="../dt02/index.html"
                class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400">
                Kelola Pelanggaran
            </a>
            <a href="../dt03/index.html"
                class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400 hover:text-white">
                Validasi Laporan
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-20 bg-white border-b border-slate-100 flex items-center justify-end px-12 relative z-50">
            <div class="relative inline-block text-left">
                <button id="userMenuBtn"
                    class="flex items-center gap-3 hover:bg-slate-50 p-2 rounded-xl transition-all outline-none group">
                    <span class="text-right">
                        <p class="text-sm font-bold text-slate-800 group-hover:text-blue-600">Bahlil</p>
                    </span>
                    <div class="flex items-center gap-2">
                        <div
                            class="w-10 h-10 bg-slate-200 rounded-full flex items-center justify-center border-2 border-white shadow-sm">
                            <i class="fa-solid fa-user text-slate-500"></i>
                        </div>
                        <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 transition-transform duration-300"
                            id="chevronIcon"></i>
                    </div>
                </button>

                <div id="dropdownMenu"
                    class="hidden absolute right-0 mt-2 w-48 bg-white border border-slate-100 rounded-2xl shadow-xl py-2 z-50 overflow-hidden">
                    <button onclick="handleLogout()"
                        class="w-full flex items-center gap-3 px-4 py-3 text-sm text-red-500 hover:bg-red-50 transition-all">
                        <i class="fa-solid fa-right-from-bracket w-5 text-center"></i> Logout
                    </button>
                </div>
            </div>
        </header>

        <div class="flex-1 p-10 overflow-y-auto flex items-center justify-center">
            <div class="w-full max-w-xl">
                <div class="bg-white rounded-3xl shadow-2xl border border-gray-100 overflow-hidden mb-6">
                    <div class="bg-gray-800 p-6 text-center border-b-4 border-indigo-500">
                        <h2 id="formHeader" class="text-2xl font-bold text-white tracking-wide">Form Kategori</h2>
                    </div>

                    <div class="p-10">
                        <form id="categoryForm" class="space-y-8">
                            <div>
                                <label class="block text-sm font-semibold text-gray-600 mb-3 ml-1">Nama Kategori</label>
                                <input type="text" id="categoryName"
                                    placeholder="-- Contoh : Prestasi Regional/Provinsi --"
                                    class="w-full px-5 py-4 bg-gray-50 border-2 border-gray-200 rounded-2xl focus:border-indigo-500 focus:bg-white focus:outline-none transition-all duration-300 text-gray-700 shadow-sm"
                                    required>
                                <p id="errorMessage" class="hidden text-red-500 text-xs mt-2 ml-1 font-semibold italic">
                                    <i class="fa-solid fa-circle-exclamation mr-1"></i> Nama kategori sudah ada dalam
                                    daftar!
                                </p>
                            </div>

                            <div class="pt-4">
                                <button type="submit" id="submitBtn"
                                    class="w-full form-gradient text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-200 hover:shadow-indigo-400 hover:-translate-y-1 transition-all duration-300 uppercase tracking-wider text-sm">
                                    Save
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="flex justify-start px-2">
                    <a href="index.html" id="backLink"
                        class="flex items-center gap-2 text-gray-500 hover:text-gray-800 transition-all font-medium text-sm underline underline-offset-4">
                        <i class="fa-solid fa-circle-chevron-left"></i>
                        Kembali
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- FUNGSI GENERATOR BARIS INPUT (Logika Prestasi vs Peran/Durasi) ---
        function createRowHTML(sectionTitle) {
            // Logika utama: Cek apakah judul mengandung kata 'prestasi'
            const isPrestasi = sectionTitle.toLowerCase().includes('prestasi');

            return `
            <div class="row-item flex gap-4 mb-2 animate-fadeIn">
                <input type="text" class="row-label flex-1 p-2 border rounded-xl bg-gray-50 outline-none focus:border-indigo-500" placeholder="Keterangan">
                
                ${isPrestasi ? 
                    `<input type="number" class="row-value w-24 p-2 border rounded-xl font-bold text-indigo-600 outline-none focus:border-indigo-500" placeholder="Nilai">` : 
                    `<input type="hidden" class="row-value" value="0">` 
                }
                
                <button type="button" onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-600">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>`;
        }

        // --- LOGIKA DROPDOWN LOGOUT ---
        const menuBtn = document.getElementById('userMenuBtn');
        const dropdown = document.getElementById('dropdownMenu');
        const chevron = document.getElementById('chevronIcon');

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isHidden = dropdown.classList.toggle('hidden');
            chevron.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(180deg)';
        });

        window.addEventListener('click', () => {
            dropdown.classList.add('hidden');
            chevron.style.transform = 'rotate(0deg)';
        });

        function handleLogout() {
            if (confirm("Apakah Anda yakin ingin logout?")) {
                window.location.href = "../login.html";
            }
        }

        // --- LOGIKA FORM KATEGORI ---
        const categoryInput = document.getElementById('categoryName');
        const formTitle = document.getElementById('formHeader');
        const submitBtn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMessage');

        const defaultCategories = [
            "Organisasi – Anggota", "Organisasi - Pengurus", "Kepanitiaan Internal",
            "Kepanitiaan Eksternal", "Prestasi Universitas", "Prestasi Regional",
            "Prestasi Nasional", "Pelatihan/Workshop Peserta", "Karya Ilmiah & Jurnal",
            "Keagamaan", "Seminar Internasional", "Beasiswa & Hibah",
            "Unit Kegiatan Mahasiswa (UKM)", "Bakti Sosial & Relawan", "Sertifikasi Kompetensi",
            "Magang & Praktik Kerja", "Pertukaran Mahasiswa", "Wirausaha / Startup",
            "Lomba Inovasi Teknologi", "Kritik & Esai Populer"
        ];

        let allCategories = JSON.parse(localStorage.getItem('myCategories')) || defaultCategories;
        const editIndex = sessionStorage.getItem('editIndex');

        if (editIndex !== null) {
            formTitle.innerText = "Edit Kategori";
            submitBtn.innerText = "Update";
            categoryInput.value = allCategories[editIndex];
        }

        document.getElementById('categoryForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const newName = categoryInput.value.trim();
            errorMsg.classList.add('hidden');

            const isDuplicate = allCategories.some((cat, index) => {
                if (editIndex !== null && index == editIndex) return false;
                return cat.toLowerCase() === newName.toLowerCase();
            });

            if (isDuplicate) {
                errorMsg.classList.remove('hidden');
                categoryInput.classList.add('border-red-400');
                categoryInput.focus();
                return;
            }

            let allKegiatanData = JSON.parse(localStorage.getItem('all_kegiatan_data')) || {};

            if (editIndex !== null) {
                const oldName = allCategories[editIndex];
                if (oldName !== newName) {
                    if (allKegiatanData[oldName]) {
                        allKegiatanData[newName] = allKegiatanData[oldName];
                        delete allKegiatanData[oldName];
                    }
                    localStorage.setItem('all_kegiatan_data', JSON.stringify(allKegiatanData));
                }
                allCategories[editIndex] = newName;
                sessionStorage.removeItem('editIndex');
            } else {
                allCategories.push(newName);
            }

            localStorage.setItem('myCategories', JSON.stringify(allCategories));
            window.location.href = 'index.html';
        });

        document.getElementById('backLink').addEventListener('click', () => {
            sessionStorage.removeItem('editIndex');
        });

        categoryInput.addEventListener('input', () => {
            errorMsg.classList.add('hidden');
            categoryInput.classList.remove('border-red-400');
        });
    </script>
</body>

</html>
