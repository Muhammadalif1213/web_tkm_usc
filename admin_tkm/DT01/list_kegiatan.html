<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Kegiatan - Admin TKM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        /* Styling untuk menu yang sedang aktif */
        .sidebar-active {
            background: rgba(255, 255, 255, 0.1);
            border-left: 4px solid #3b82f6;
            color: #3b82f6 !important;
            font-weight: 700;
        }
    </style>
</head>

<body class="bg-[#f9fafb] flex h-screen overflow-hidden text-gray-800">

    <aside class="w-72 bg-[#1e293b] text-gray-300 p-6 flex flex-col gap-8 shadow-xl z-20">
        <div class="flex items-center gap-3 px-2">
            <div>
                <h1 class="font-bold text-white text-lg tracking-tight">Admin TKM</h1>
                <p class="text-[10px] text-gray-400 uppercase tracking-widest">Universitas Surya Cemerlang</p>
            </div>
        </div>

        <nav class="flex flex-col gap-2 text-sm">
            <a href="../index.html"
                class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400 hover:text-white">
                Dashboard
            </a>
            <a href="index.html" class="flex items-center p-3 rounded-lg sidebar-active transition hover:text-white">
                Manajemen Kategori & Kegiatan
            </a>
            <a href="../dt02/index.html"
                class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400">
                Kelola Pelanggaran
            </a>
            <a href="../dt03/index.html"
                class="flex items-center p-3 rounded-lg hover:bg-gray-800 transition text-gray-400 hover:text-white">
                Validasi Laporan
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-end px-8 relative z-50">
            <div class="relative inline-block text-left">
                <button id="userMenuBtn"
                    class="flex items-center gap-3 hover:bg-gray-50 p-2 rounded-xl transition-all outline-none">
                    <div class="text-right">
                        <p class="text-sm font-bold text-gray-900 leading-none">Bahlil</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <div
                            class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center border border-gray-200">
                            <i class="fa-solid fa-user text-gray-400"></i>
                        </div>
                        <i class="fa-solid fa-chevron-down text-[10px] text-gray-400 transition-transform duration-300"
                            id="chevronIcon"></i>
                    </div>
                </button>
                <div id="dropdownMenu"
                    class="hidden absolute right-0 mt-2 w-48 bg-white border border-gray-100 rounded-2xl shadow-xl py-2 z-50">
                    <button onclick="handleLogout()"
                        class="w-full flex items-center gap-3 px-4 py-3 text-sm text-red-500 hover:bg-red-50 transition-all">
                        <i class="fa-solid fa-right-from-bracket w-5 text-center"></i> Logout
                    </button>
                </div>
            </div>
        </header>

        <div class="flex-1 p-10 overflow-y-auto">
            <div class="max-w-5xl mx-auto">
                <h2 id="titleKegiatan" class="text-3xl font-bold text-center text-gray-900 mb-8">List kegiatan</h2>

                <div class="flex justify-end gap-3 mb-6">
                    <select id="filterJenis"
                        class="bg-gray-200 text-gray-800 px-4 py-2 rounded-full text-sm font-bold outline-none border-none cursor-pointer hover:bg-gray-300 transition-all">
                        <option value="Semua">Semua Jenis</option>
                        <option value="Wajib">Wajib</option>
                        <option value="Pilihan">Pilihan</option>
                    </select>
                    <button onclick="window.location.href='form_kegiatan.html'"
                        class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded-full text-sm font-bold flex items-center gap-2 transition-all">
                        <i class="fa-solid fa-plus text-[10px]"></i> Buat Kegiatan
                    </button>
                </div>

                <div class="bg-white rounded-xl border border-black overflow-hidden shadow-sm">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-black bg-gray-50">
                                <th class="p-4 font-bold border-r border-black w-16 text-center">No</th>
                                <th class="p-4 font-bold border-r border-black">Nama Kegiatan</th>
                                <th class="p-4 font-bold border-r border-black">Jenis Kegiatan</th>
                                <th class="p-4 font-bold text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="listTableBody"></tbody>
                    </table>
                </div>

                <div class="mt-8 grid grid-cols-3 items-center">
                    <div class="flex justify-start">
                        <a href="index.html"
                            class="flex items-center gap-2 text-gray-900 font-bold text-sm hover:text-blue-600 transition-colors">
                            <i class="fa-solid fa-circle-chevron-left"></i> Kembali
                        </a>
                    </div>
                    <div id="paginationContainer" class="flex justify-center items-center gap-2 text-sm font-medium">
                    </div>
                    <div class="text-right text-xs text-gray-500 font-medium" id="pageInfo"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- 1. LOGIK UI (DROPDOWN MENU) ---
        // Bagian ini sangat penting agar menu logout bisa terbuka
        const menuBtn = document.getElementById('userMenuBtn');
        const dropdown = document.getElementById('dropdownMenu');
        const chevron = document.getElementById('chevronIcon');

        if (menuBtn) {
            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isHidden = dropdown.classList.toggle('hidden');
                // Memutar icon panah saat menu terbuka
                if (chevron) {
                    chevron.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(180deg)';
                }
            });
        }

        // Menutup dropdown jika user klik di luar menu
        window.addEventListener('click', () => {
            if (dropdown) dropdown.classList.add('hidden');
            if (chevron) chevron.style.transform = 'rotate(0deg)';
        });

        // --- 2. LOGIK LOGOUT ---
        function handleLogout() {
            if (confirm("Apakah Anda yakin ingin logout?")) {
                window.location.href = "../login.html";
            }
        }

        // --- 3. DATA & KONFIGURASI TABEL ---
        const masterKegiatan = [
            { nama: "Latihan Dasar Kepemimpinan", jenis: "Wajib" },
            { nama: "Workshop Teknik Presentasi", jenis: "Pilihan" }
        ];

        let currentPage = 1;
        const rowsPerPage = 10;
        let currentFilter = "Semua";

        // --- 4. FUNGSI RENDER TABEL ---
        function renderTable() {
            const tableBody = document.getElementById('listTableBody');
            if (!tableBody) return;
            tableBody.innerHTML = "";

            const currentCat = sessionStorage.getItem('currentCategoryName') || 'Umum';
            const allData = JSON.parse(localStorage.getItem('all_kegiatan_data')) || {};
            let currentListData = allData[currentCat] || [];

            const filteredData = currentListData.filter(item =>
                currentFilter === "Semua" || item.jenis === currentFilter
            );

            const startIndex = (currentPage - 1) * rowsPerPage;
            const endIndex = startIndex + rowsPerPage;
            const paginatedData = filteredData.slice(startIndex, endIndex);

            if (paginatedData.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-gray-500 italic border border-black">Belum ada kegiatan.</td></tr>`;
                updatePagination(0);
                return;
            }

            paginatedData.forEach((item, index) => {
                const actualIndex = currentListData.indexOf(item);
                const badgeClass = (item.jenis === "Wajib") ? "bg-orange-100 text-orange-700" : "bg-blue-100 text-blue-700";

                const row = `
                <tr class="border-b border-black">
                    <td class="p-4 border-r border-black text-center">${startIndex + index + 1}</td>
                    <td class="p-4 border-r border-black font-medium">${item.nama}</td>
                    <td class="p-4 border-r border-black text-center">
                        <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase ${badgeClass}">${item.jenis}</span>
                    </td>
                    <td class="p-4 text-center">
                        <a href="detail_kegiatan.html?id=${actualIndex}&type=${encodeURIComponent(item.tipePenilaian)}&cat=${encodeURIComponent(currentCat)}" 
                           class="text-blue-600 hover:underline text-xs font-bold inline-block">
                            Detail
                        </a>
                    </td>
                </tr>`;
                tableBody.insertAdjacentHTML('beforeend', row);
            });

            updatePagination(filteredData.length);
        }

        // --- 5. FUNGSI PAGINATION ---
        function updatePagination(totalItems) {
            const container = document.getElementById('paginationContainer');
            const pageInfo = document.getElementById('pageInfo');
            if (!container) return;

            const totalPages = Math.ceil(totalItems / rowsPerPage);
            container.innerHTML = "";

            if (totalPages <= 1) {
                if (pageInfo) pageInfo.innerText = "";
                return;
            }

            // Tombol Sebelumnya
            const prevBtn = document.createElement('button');
            prevBtn.innerHTML = "Sebelumnya";
            prevBtn.className = `px-2 py-1 ${currentPage === 1 ? 'text-gray-300 cursor-not-allowed' : 'text-gray-600 hover:text-blue-600'}`;
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => { currentPage--; renderTable(); };
            container.appendChild(prevBtn);

            // Nomor Halaman
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.innerText = i;
                btn.className = `w-8 h-8 rounded font-bold transition-all ${i === currentPage ? 'bg-gray-800 text-white' : 'hover:bg-gray-200'}`;
                btn.onclick = () => { currentPage = i; renderTable(); };
                container.appendChild(btn);
            }

            // Tombol Selanjutnya
            const nextBtn = document.createElement('button');
            nextBtn.innerHTML = "Selanjutnya";
            nextBtn.className = `px-2 py-1 ${currentPage === totalPages ? 'text-gray-300 cursor-not-allowed' : 'text-gray-600 hover:text-blue-600'}`;
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => { currentPage++; renderTable(); };
            container.appendChild(nextBtn);

            pageInfo.innerText = `Menampilkan ${Math.min(totalItems, currentPage * rowsPerPage)} dari ${totalItems} data`;
        }

        // --- 6. EVENT LISTENER FILTER ---
        document.getElementById('filterJenis').addEventListener('change', function (e) {
            currentFilter = e.target.value;
            currentPage = 1;
            renderTable();
        });

        // --- 7. INITIAL LOAD (HANYA SATU WINDOW.ONLOAD) ---
        window.onload = () => {
            const currentCat = sessionStorage.getItem('currentCategoryName');
            if (currentCat && document.getElementById('titleKegiatan')) {
                document.getElementById('titleKegiatan').innerText = `List Kegiatan: ${currentCat}`;
            }

            // Memastikan tabel langsung muncul saat halaman dibuka
            renderTable();
        };
    </script>
</body>

</html>
