<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Admin Unit - Sistem TKM</title>
    <link rel="stylesheet" href="/style/style.css" />
    <link rel="stylesheet" href="/style/unit.css" />
  </head>
  <body>
    <div class="dashboard-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Sistem TKM</h2>
          <p>Universitas Surya Cemerlang</p>
        </div>
        <nav class="sidebar-menu">
          <ul>
            <li class="active"><a href="unit-dashboard.html">Dashboard</a></li>
            <li><a href="unit-lapor.html">Lapor Kegiatan Unit</a></li>
          </ul>
        </nav>
        <div class="sidebar-footer">
          <button class="btn-logout" onclick="logoutUnit()">Keluar</button>
        </div>
      </aside>

      <main class="main-content center-layout">
        <div class="page-header-unit">
          <h2>Dashboard Admin Unit</h2>
        </div>

        <div class="unit-identity-card">
          <div class="identity-item">
            <span class="label">Nama Admin:</span>
            <span class="value">Admin BEM Universitas</span>
          </div>
          <div class="identity-item">
            <span class="label">Unit:</span>
            <span class="value">BEM Universitas</span>
          </div>
        </div>
      </main>
    </div>
    <script>
      function logoutUnit() {
        if (confirm("Keluar dari Admin Unit?"))
          window.location.href = "index.html";
      }
    </script>
  </body>
</html>
