<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Portal - Validasi Laporan</title>
    <link rel="stylesheet" href="/style/style.css" />
    <link rel="stylesheet" href="/style/riwayatstyle.css" />
    <style>
      /* Style Tambahan Khusus Admin */
      .admin-badge {
        background-color: #1e293b;
        color: #fff;
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 5px;
        display: inline-block;
      }
      .btn-accept {
        background-color: #16a34a;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        margin-right: 5px;
      }
      .btn-reject {
        background-color: #dc2626;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
      }
      .btn-accept:hover {
        background-color: #15803d;
      }
      .btn-reject:hover {
        background-color: #b91c1c;
      }

      .empty-state {
        text-align: center;
        padding: 50px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Sistem TKM</h2>
          <span class="admin-badge">Administrator</span>
        </div>
        <nav class="sidebar-menu">
          <ul>
            <li class="active"><a href="#">Validasi Laporan</a></li>
            <li><a href="#">Data Mahasiswa</a></li>
            <li><a href="#">Pengaturan</a></li>
          </ul>
        </nav>
        <div class="sidebar-footer">
          <button
            class="btn-logout"
            onclick="window.location.href='index.html'"
          >
            Keluar
          </button>
        </div>
      </aside>

      <main class="main-content">
        <div class="page-title">
          <h2>Validasi Laporan Masuk</h2>
        </div>

        <div class="history-card">
          <div class="card-header-icon">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              ></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <h3>Daftar Menunggu Validasi</h3>
          </div>

          <div class="tab-content-area">
            <div class="table-container">
              <table class="custom-table">
                <thead>
                  <tr>
                    <th>Tanggal</th>
                    <th>Mahasiswa</th>
                    <th>Kegiatan</th>
                    <th>Kategori</th>
                    <th class="text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody id="adminTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="js/admin.js"></script>
  </body>
</html>
